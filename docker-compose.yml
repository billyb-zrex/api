version: '3'
services:
    flyway:
        image: flyway/flyway
        container_name: fable-db-flyway
        command: -url=jdbc:mysql://db -schemas=migration -user=${DB_USER} -password=${DB_PWD} -connectRetries=60 migrate
        volumes:
            - ./schema:/flyway/sql
        depends_on:
            - db
    db:
        image: mysql/mysql-server
        container_name: fable-db
        command: ["--default-authentication-plugin=mysql_native_password"]
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PWD}
            - MYSQL_ROOT_HOST=%
        ports:
            - "3306:3306"
