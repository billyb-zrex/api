version: '3.9'

services:
    schema:
        image: flyway/flyway
        container_name: fable-db-flyway
        command: -url=${DB_CONN_URL} -schemas=migration -user=${DB_USER} -password=${DB_PWD} -connectRetries=60 migrate
        volumes:
            - ./schema:/flyway/sql
        profiles:
            - na

    db:
        image: mysql/mysql-server
        container_name: fable-db
        command: [ "--default-authentication-plugin=mysql_native_password" ]
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PWD}
            - MYSQL_ROOT_HOST=%
        profiles:
            - dev
        ports:
            - "3306:3306"

    es:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
        container_name: es
        environment:
            - xpack.security.enabled=false
            - discovery.type=single-node
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        cap_add:
            - IPC_LOCK
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        ports:
            - "9200:9200"
            - "9300:9300"
        profiles:
            - dev
            - staging
            - prod

    kibana:
        container_name: kibana
        image: docker.elastic.co/kibana/kibana:8.4.3
        environment:
            - ELASTICSEARCH_HOSTS=http://es:9200
        ports:
            - "5601:5601"
        profiles:
            - dev
            - staging
            - prod
        depends_on:
            - es

volumes:
    elasticsearch-data:
        driver: local
